name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The e2e test does not run here, so skip the Chrome for Testing download.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # No install scripts: nothing here needs them (the e2e Chrome download is skipped).
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
